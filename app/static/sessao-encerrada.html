<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sessão encerrada | Taxa de Sala 360</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
  <!--
    Página estática (sem Streamlit / sem websocket).
    Servida por /app/static/ — abrir esta página não mantém a instância do Cloud Run ativa.
    Cores = BRAND em app/services/ui.py
  -->
  <style>
    :root {
      --bg: #0B1220;
      --card: #101E36;
      --border: rgba(255,255,255,0.10);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.70);
      --primary: #5B7CFF;
      --primary2: #7AA2FF;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Source Sans Pro", "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .logo { height: 56px; margin-bottom: 18px; }

    h1 {
      font-size: 1.6rem;
      font-weight: 850;
      letter-spacing: -0.02em;
      margin: 0 0 10px 0;
    }

    p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(180deg, var(--primary2), var(--primary));
      color: #ffffff;
      text-decoration: none;
      border-radius: 14px;
      padding: 0.80rem 1.40rem;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 10px 30px rgba(91,124,255,0.18);
      transition: transform .12s ease, filter .12s ease;
    }
    .btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .btn:active { filter: brightness(0.98); transform: translateY(0); }
    .btn:focus-visible { outline: 2px solid rgba(122,162,255,0.55); outline-offset: 2px; }

    .hint {
      margin: 18px 0 0 0;
      font-size: 0.88rem;
      color: var(--muted);
      opacity: 0.85;
    }

    footer {
      margin-top: 28px;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
    }
    footer strong { color: var(--text); }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo-360.png" alt="360">
    <h1>Sessão encerrada</h1>
    <p id="msg">Sua sessão foi encerrada por inatividade.<br>Para continuar, inicie uma nova sessão e faça login novamente.</p>
    <a class="btn" href="/">Reiniciar sessão</a>
    <p class="hint">Se já terminou, pode fechar esta aba.</p>
  </main>

  <footer>
    <strong>Pró-Corpo BI</strong>
    &nbsp;|&nbsp;
    Desenvolvido por <strong>Thales Basilio Santoro</strong>
    para <strong>360 Estética</strong>
  </footer>

  <script>
    // ?motivo=logout -> mensagem de saída manual
    if (new URLSearchParams(location.search).get("motivo") === "logout") {
      document.getElementById("msg").innerHTML =
        "Você saiu da sua conta.<br>Para acessar novamente, inicie uma nova sessão.";
    }
  </script>
</body>
</html>
